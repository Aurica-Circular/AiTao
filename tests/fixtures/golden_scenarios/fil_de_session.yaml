name: fil_de_session
description: >
  Étude §6.6 — la "connexion rationnelle" de session : le fil doit survivre
  à un aparté (tour 3, sujet différent) et retomber sur le bon document
  quand l'utilisateur y revient explicitement (tour 4), jamais sur le sujet
  de l'aparté. Fenêtre glissante HISTORY_TURNS=3 actuelle insuffisante par
  construction — cible du dossier courant (US-102).
incident: ""
phase: 1
corpus: committed
turns:
  - user: "Quel document parle de 範例玻璃 ?"
    expect:
      context_contains: ["zh_glass"]
  - user: "Combien de pages contient-il ?"
    expect:
      referent_kept: "zh_glass"
  - user: "Quel est le loyer mensuel du bail de Jean Dupont ?"
    expect:
      context_contains: ["fr_bail"]
  - user: "Reviens au premier document, quel est son titre ?"
    expect:
      referent_kept: "zh_glass"
      context_excludes: ["fr_bail", "fr_barometre"]
